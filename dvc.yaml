stages:
  prepare:
    cmd: python -m src.ml.prepare
    deps:
      - src/ml/prepare.py
      - src/ml/config.py
      - data/raw/fraud_5000.csv
    params:
      - seed
      - prepare.test_size
      - prepare.target
      - prepare.drop_columns
      - prepare.stratify
    outs:
      - data/processed/train.csv
      - data/processed/valid.csv

  train:
    cmd: python -m src.ml.train
    deps:
      - src/ml/train.py
      - src/ml/scoring.py
      - src/ml/config.py
      - data/processed/train.csv
      - data/processed/valid.csv
    params:
      - seed
      - prepare.target
      - train.model
      - train.n_estimators
      - train.max_depth
      - train.min_samples_leaf
      - train.class_weight
    outs:
      - models/mlflow_run_id:
          cache: false      # plain text run ID -> goes to GIT
