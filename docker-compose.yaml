#   PostgreSQL   -> backend store (futasok, parameterek, metrikak, registry)
#   MinIO        -> artifact store (modellek, abrak) S3-kompatibilisen
#   MLflow       -> tracking server, proxyzott artefaktum-eleressel
#   API          -> FastAPI scoring service, http://localhost:8000/docs
#   UI           -> Streamlit, http://localhost:8501

# Start:  cp .env.example .env  &&  docker compose up -d
# Konzol: http://localhost:9001   S3 API: http://localhost:9000
# Stop:   docker compose down          (data remain)
#         docker compose down -v       (data deleted)
#
# NETWORK:
#     Between the containers are using the compose service name: http://minio:9000
#           (postgres:5432, minio:9000, mlflow:5000)
#     From host: published port (localhost:5500, localhost:9000), bound to 127.0.0.1 so
#     other machines on the network cannot connect
#     Never use 127.0.0.1 between containers.

# reset containers
# docker compose run --rm dvc-cleanup
# docker compose down -v --remove-orphans
# docker image rm mlops:local

x-env: &x-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ENDPOINT_HOST: http://localhost:9000
  DVC_BUCKET: ${DVC_BUCKET:-dvc}
  DVC_REMOTE: ${DVC_REMOTE:-storage}
  NO_PROXY: minio,localhost
  MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-mlflow}
  PYTHONUNBUFFERED: "1"

secrets:
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt

services:
  postgres:
    image: postgres:16-alpine
    container_name: mlflow-postgres
    environment: *x-env
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: coollabsio/minio:latest
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      <<: *x-env
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_password
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Once init-container: create DVC store and exit
  create-buckets:
    build:
      context: .
      dockerfile: docker/dvc_dockerfile
    secrets:
      - minio_root_password
    image: mlops:local
    pull_policy: never
    depends_on: [minio]
    environment: *x-env
    restart: "no"

  # Once set dvc remote config and exit
  set-dvc-remote:
    image: mlops:local
    pull_policy: never
    depends_on:
      create-buckets:
        condition: service_completed_successfully
    environment:
      <<: *x-env
    secrets:
      - minio_root_password
    volumes: [".:/workspace"]
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)"
        dvc remote add --local -d -f "$$DVC_REMOTE" "s3://$$DVC_BUCKET"
        # dvc remote modify --local "$$DVC_REMOTE" endpointurl "$$MINIO_ENDPOINT"
        dvc remote modify --local "$$DVC_REMOTE" endpointurl "$$MINIO_ENDPOINT_HOST"
        dvc remote modify --local "$$DVC_REMOTE" access_key_id $${MINIO_ROOT_USER};
        dvc remote modify --local "$$DVC_REMOTE" secret_access_key $${MINIO_ROOT_PASSWORD};
        dvc remote list --local
    restart: "no"

  dvc-cleanup:
    image: mlops:local
    pull_policy: never
    profiles: ["cleanup"]
    environment:
      <<: *x-env
      HOME: /tmp
    volumes: [".:/workspace"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - dvc remote remove --local "$$DVC_REMOTE" || true

  mlflow:
    build:
      dockerfile: docker/mlflow_dockerfile
    secrets:
      - postgres_admin_password
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *x-env
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination s3://${MLFLOW_BUCKET}
      --serve-artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5500}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Scoring API: http://localhost:8000/docs
  # POST /train reads the data and params and writes the pipeline outputs, so they are
  # mounted from the project folder and the results land in the working tree.
  api:
    build:
      dockerfile: docker/api_dockerfile
    container_name: fraud-api
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-0.5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
      - ./logs:/app/logs
      - ./params.yaml:/app/params.yaml:ro
      - ./dvc.lock:/app/dvc.lock:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Time to store the prediction log in MLflow at shutdown.
    stop_grace_period: 30s
    restart: unless-stopped

  # Streamlit UI: http://localhost:8501. It calls the API from the server side, so CORS doesn't apply.
  ui:
    build:
      dockerfile: docker/ui_dockerfile
    container_name: fraud-ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  minio-data:
  pg-data:
