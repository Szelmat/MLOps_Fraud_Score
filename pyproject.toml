[project]
name = "mlops-fraud-score"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "mlflow==3.16.1",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "structlog>=26.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "flake8>=7.4.1",
    "httpx2>=2.13.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]


[tool.coverage.run]
source = ["src", "tests"]

[tool.coverage.report]
fail_under = 100

[tool.fastapi]
entrypoint = "src.api.main:app"
